name: Temporary issue 3973 runtime validation

on:
  push:
    branches: [ci/3973-runtime-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: fossy
      PGPASSWORD: fossy
      PGDATABASE: fossology
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fossy
          POSTGRES_PASSWORD: fossy
          POSTGRES_DB: fossology
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fossy -d fossology"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout patched fork
        uses: actions/checkout@v4
        with:
          path: patched
          persist-credentials: false

      - name: Checkout unmodified upstream
        uses: actions/checkout@v4
        with:
          repository: fossology/fossology
          ref: 7c5702359855b71d13864228d351f31aba604fa7
          path: baseline
          persist-credentials: false

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: gettext, mbstring, gd, json, xml, zip, pgsql, curl, uuid, posix, sqlite3
          tools: composer:v2
        env:
          fail-fast: true

      - name: Verify runtime and install Composer dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/schema3973/twig
          php -v | tee /tmp/schema3973/php-version.log
          php -m | tee /tmp/schema3973/php-modules.log
          psql --version | tee /tmp/schema3973/psql-version.log
          psql -At -c 'SELECT version()' | tee /tmp/schema3973/postgres-version.log
          php -r 'foreach (["pgsql", "mbstring", "xml", "curl", "uuid", "posix", "sqlite3"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "Missing extension: $e\n"); exit(1); } }'
          cp patched/src/lib/php/tests/test_libschema.php baseline/src/lib/php/tests/test_libschema.php
          for tree in patched baseline; do
            composer install --no-interaction --prefer-dist --working-dir="$tree/src" 2>&1 | tee "/tmp/schema3973/$tree-composer.log"
            composer check-platform-reqs --working-dir="$tree/src" 2>&1 | tee "/tmp/schema3973/$tree-platform.log"
            sed 's|@FO_TWIG_CACHE@|/tmp/schema3973/twig|g' "$tree/src/lib/php/services.xml.in" > "$tree/src/lib/php/services.xml"
            test -s "$tree/src/lib/php/services.xml"
            test -f "$tree/src/vendor/autoload.php"
            test -x "$tree/src/vendor/bin/phpunit"
            php -l "$tree/src/lib/php/libschema.php" | tee "/tmp/schema3973/$tree-libschema-lint.log"
            php -l "$tree/src/lib/php/tests/test_libschema.php" | tee "/tmp/schema3973/$tree-test-lint.log"
          done

      - name: Run regression test against upstream and patch
        shell: bash
        run: |
          set -o pipefail
          set +e
          for tree in baseline patched; do
            php "$tree/src/vendor/bin/phpunit" \
              --configuration "$tree/src/lib/php/tests/tests.xml" \
              --log-junit "/tmp/schema3973/$tree-junit.xml" \
              --filter testInheritedLocalColumnsRemainStableAcrossUpdates \
              "$tree/src/lib/php/tests/test_libschema.php" \
              2>&1 | tee "/tmp/schema3973/$tree-phpunit.log"
            echo "$?" > "/tmp/schema3973/$tree-phpunit.exit"
          done

      - name: Prepare full ApplySchema probe
        shell: bash
        run: |
          cat > /tmp/schema3973/apply-schema.php <<'PHP'
          <?php
          $tree = $argv[1] ?? '';
          if (!in_array($tree, array('baseline', 'patched'), true)) {
            fwrite(STDERR, "Unexpected checkout\n");
            exit(2);
          }
          $root = realpath(getenv('GITHUB_WORKSPACE') . '/' . $tree);
          if ($root === false || getenv('PGHOST') !== '127.0.0.1' ||
              getenv('PGPORT') !== '5432') {
            fwrite(STDERR, "Refusing an unexpected database target\n");
            exit(2);
          }
          require_once $root . '/src/vendor/autoload.php';
          require_once $root . '/src/lib/php/common-db.php';
          require_once $root . '/src/lib/php/common-cache.php';
          $PG_CONN = pg_connect('host=127.0.0.1 port=5432 dbname=fossology user=fossy password=fossy');
          if (!$PG_CONN || pg_dbname($PG_CONN) !== 'fossology') {
            fwrite(STDERR, "Could not connect to the disposable database\n");
            exit(2);
          }
          $SysConf = array('DBCONF' => array('dbname' => 'fossology', 'user' => 'fossy'));
          $GLOBALS['SysConf'] = $SysConf;
          $dbManager = new \Fossology\Lib\Db\ModernDbManager(new \Monolog\Logger('schema3973'));
          $dbManager->setDriver(new \Fossology\Lib\Db\Driver\Postgres($PG_CONN));
          require_once $root . '/src/lib/php/libschema.php';
          try {
            $result = $libschema->applySchema(
              $root . '/src/www/ui/core-schema.dat', false, 'fossology'
            );
            if ($result !== false) {
              throw new \RuntimeException((string) $result);
            }
            echo "ApplySchema completed\n";
          } catch (\Throwable $e) {
            fwrite(STDERR, $e->__toString() . "\n");
            exit(1);
          }
          PHP
          php -l /tmp/schema3973/apply-schema.php | tee /tmp/schema3973/probe-lint.log

      - name: Repeated full schema updates on disposable databases
        shell: bash
        run: |
          set +e
          for tree in baseline patched; do
            if [ "$tree" = patched ]; then
              psql -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE fossology WITH (FORCE);" \
                >> /tmp/schema3973/reset-database.log 2>&1
              reset_drop=$?
              psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE fossology OWNER fossy;" \
                >> /tmp/schema3973/reset-database.log 2>&1
              reset_create=$?
              if [ "$reset_drop" -ne 0 ] || [ "$reset_create" -ne 0 ]; then
                echo "Database reset failed: drop=$reset_drop create=$reset_create" \
                  | tee -a /tmp/schema3973/reset-database.log
                break
              fi
            fi
            : > "/tmp/schema3973/$tree-catalog.tsv"
            for pass in 1 2 3 4; do
              php /tmp/schema3973/apply-schema.php "$tree" \
                >> "/tmp/schema3973/$tree-full-schema.log" 2>&1
              rc=$?
              counts=$(psql -At -F '|' -c \
                "SELECT count(*) FILTER (WHERE attisdropped),
                        count(*) FILTER (WHERE NOT attisdropped),
                        COALESCE(max(attnum), 0)
                   FROM pg_attribute
                  WHERE attrelid = to_regclass('public.license_candidate')
                    AND attnum > 0" 2>> "/tmp/schema3973/$tree-full-schema.log")
              query_rc=$?
              if [ "$query_rc" -ne 0 ]; then counts="query-failed|query-failed|query-failed"; fi
              printf '%s|%s|%s|%s\n' "$tree" "$pass" "$rc" "$counts" \
                | tee -a "/tmp/schema3973/$tree-catalog.tsv"
              if [ "$rc" -ne 0 ]; then break; fi
            done
          done

      - name: Evaluate recorded results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/schema3973/evaluation.log
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path('/tmp/schema3973')
          problems = []

          for tree, expected_failure in [('baseline', True), ('patched', False)]:
              path = root / f'{tree}-junit.xml'
              if not path.exists():
                  problems.append(f'{tree}: JUnit result missing')
                  continue
              xml = ET.parse(path).getroot()
              suites = [xml] if 'tests' in xml.attrib else list(xml.iter('testsuite'))
              totals = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ('tests', 'failures', 'errors', 'skipped')
              }
              print(f'{tree} PHPUnit: {totals}')
              if totals['tests'] != 1 or totals['skipped'] != 0 or totals['errors'] != 0:
                  problems.append(f'{tree}: expected one executed, unskipped test')
              if expected_failure and totals['failures'] < 1:
                  problems.append('baseline: expected regression failure was absent')
              if not expected_failure and totals['failures'] != 0:
                  problems.append('patched: regression test failed')

          for tree in ('baseline', 'patched'):
              path = root / f'{tree}-catalog.tsv'
              if not path.exists():
                  problems.append(f'{tree}: catalog results missing')
                  continue
              rows = [line.strip().split('|') for line in path.read_text().splitlines()]
              print(f'{tree} catalog: {rows}')
              if len(rows) != 4 or any(len(row) != 6 or row[2] != '0' for row in rows):
                  problems.append(f'{tree}: four successful ApplySchema runs required')
                  continue
              dropped = [int(row[3]) for row in rows]
              if tree == 'baseline' and not all(
                  dropped[i] > dropped[i-1] for i in range(1, 4)
              ):
                  problems.append('baseline: dropped-column growth not reproduced')
              if tree == 'patched' and len(set(dropped)) != 1:
                  problems.append('patched: dropped-column count increased')

          if problems:
              print('NOT READY: ' + '; '.join(problems))
              sys.exit(1)
          print('Runtime checks passed')
          PY

      - name: Upload complete validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-3973-runtime-validation
          path: /tmp/schema3973/
          if-no-files-found: warn
          retention-days: 14
